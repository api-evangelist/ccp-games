aid: ccp-games
name: CCP Games
description: >-
  CCP Games is the Reykjavik-based studio behind EVE Online, the long-running
  single-shard massively multiplayer space sandbox. CCP operates one of the most
  mature third-party developer programs in gaming through the EVE Swagger Interface
  (ESI) - a public, versioned REST API that exposes character, corporation, alliance,
  market, industry, universe, and fleet data from the live Tranquility server. ESI
  is secured with EVE SSO (OAuth 2.0 / OpenID Connect on login.eveonline.com) using
  fine-grained per-scope consent, and is governed by a free third-party Developer
  License Agreement. This profile enriches the CCP Games entry with the real ESI API
  surface: its OpenAPI 3.1 description, authentication and OAuth scope model, error
  and error-limit conventions, lifecycle/deprecation posture, and agent-readiness
  artifacts.
