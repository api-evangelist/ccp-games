      type: array
    AlliancesAllianceIdContactsGet:
      items:
        properties:
          contact_id:
            format: int64
            type: integer
          contact_type:
            enum:
            - character
            - corporation
            - alliance
            - faction
            type: string
          label_ids:
            items:
              description: Label IDs applied to the contact
              format: int64
              type: integer
            type: array
          standing:
            description: Standing of the contact
            format: double
            type: number
        required:
