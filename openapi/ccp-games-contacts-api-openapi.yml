        - contact_type
        - contact_id
        type: object
      type: array
    CorporationsCorporationIdContactsGet:
      items:
        properties:
          contact_id:
            format: int64
            type: integer
          contact_type:
            enum:
            - character
            - corporation
            - alliance
            - faction
            type: string
          is_watched:
            description: Whether this contact is being watched
            type: boolean
          label_ids:
            items:
              description: Label IDs applied to the contact
              format: int64
              type: integer
            type: array
          standing:
            description: Standing of the contact
            format: double
            type: number
        required:
        - standing
        - contact_type
        - contact_id
        type: object
      type: array
    CharactersCharacterIdContactsPost:
      description: 201 created array
      items:
        description: 201 created integer
        format: int64
        type: integer
      type: array
    AlliancesAllianceIdContactsLabelsGet:
      items:
        properties:
          label_id:
            format: int64
            type: integer
          label_name:
            type: string
        required:
        - label_id
        - label_name
        type: object
      type: array
  headers:
    LastModified:
      description: The last modified date of the response. Use this with If-Modified-Since to check whether the resource has changed.
      schema:
        type: string
    ETag:
      description: The ETag value of the response body. Use this with If-None-Match to check whether the resource has changed.
      schema:
        type: string
    CacheControl:
      description: Directives for caching mechanisms. It controls how the response can be cached, by whom, and for how long.
      schema:
        type: string
