components:
  parameters:
    IfNoneMatch:
      description: The ETag of the previous request. A 304 will be returned if this matches the current ETag.
      in: header
      name: If-None-Match
      schema:
        type: string
    Tenant:
      description: The tenant ID for the request.
      example: ''
      in: header
      name: X-Tenant
      schema:
        default: tranquility
        type: string
    CompatibilityDate:
      description: The compatibility date for the request.
      in: header
      name: X-Compatibility-Date
      required: true
      schema:
        enum:
        - '2020-01-01'
        format: date
        type: string
    AcceptLanguage:
      description: The language to use for the response.
      in: header
      name: Accept-Language
      schema:
        default: en
        enum:
        - en
        - de
        - fr
        - ja
        - ru
        - zh
        - ko
        - es
        type: string
    IfModifiedSince:
      description: The date the resource was last modified. A 304 will be returned if the resource has not been modified since this date.
      in: header
      name: If-Modified-Since
      schema:
        type: string
  schemas:
    ErrorDetail:
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    Error:
      properties:
        details:
          description: List of individual error details.
          items:
            $ref: '#/components/schemas/ErrorDetail'
          type: array
        error:
          description: Error message.
          type: string
      required:
      - error
      type: object
    CharacterID:
      examples:
      - 90000001
      format: int64
      type: integer
      x-common-model: 'true'
    CharactersCharacterIdContactsGet:
      items:
        properties:
          contact_id:
            format: int64
            type: integer
          contact_type:
            enum:
            - character
            - corporation
            - alliance
            - faction
            type: string
          is_blocked:
            description: Whether this contact is in the blocked list. Note a missing value denotes unknown, not true or false
            type: boolean
          is_watched:
            description: Whether this contact is being watched
            type: boolean
          label_ids:
            items:
              description: Label IDs applied to the contact
              format: int64
              type: integer
            type: array
          standing:
            description: Standing of the contact
            format: double
            type: number
        required:
        - standing
        - contact_type
        - contact_id
        type: object
      type: array
    CorporationID:
      examples:
      - 98777771
      format: int64
      type: integer
      x-common-model: 'true'
    AllianceID:
      examples:
      - 99000001
      format: int64
      type: integer
      x-common-model: 'true'
    CharactersCharacterIdContactsLabelsGet:
      items:
        properties:
          label_id:
            format: int64
            type: integer
          label_name:
            type: string
        required:
        - label_id
        - label_name
        type: object
      type: array
    CorporationsCorporationIdContactsLabelsGet:
      items:
        properties:
          label_id:
            format: int64
            type: integer
          label_name:
            type: string
        required:
