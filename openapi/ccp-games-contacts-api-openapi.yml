      x-cache-age: 300
      x-compatibility-date: '2020-01-01'
      x-rate-limit:
        group: char-social
        max-tokens: 600
        window-size: 15m
    post:
      description: Bulk add contacts with same settings
      operationId: PostCharactersCharacterIdContacts
      parameters:
      - description: The ID of the character
        in: path
        name: character_id
        required: true
        schema:
          $ref: '#/components/schemas/CharacterID'
      - in: query
        name: label_ids
        schema:
          description: Add custom labels to the new contact
          items:
            format: int64
            type: integer
          maxItems: 63
          type: array
      - in: query
        name: standing
        required: true
        schema:
          description: Standing for the contact
          format: double
          type: number
      - in: query
        name: watched
        schema:
          default: false
          description: Whether the contact should be watched, note this is only effective on characters
          type: boolean
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/IfNoneMatch'
      - $ref: '#/components/parameters/CompatibilityDate'
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/IfModifiedSince'
      requestBody:
        content:
          application/json:
            schema:
              items:
                description: ID of the contact to edit
                format: int64
                type: integer
              maxItems: 100
              minItems: 1
              type: array
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharactersCharacterIdContactsPost'
          description: Created
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
            Last-Modified:
              $ref: '#/components/headers/LastModified'
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      security:
      - OAuth2:
        - esi-characters.write_contacts.v1
      summary: Add contacts
      tags:
      - Contacts
      x-compatibility-date: '2020-01-01'
      x-rate-limit:
        group: char-social
        max-tokens: 600
        window-size: 15m
    put:
      description: Bulk edit contacts with same settings
      operationId: PutCharactersCharacterIdContacts
      parameters:
      - description: The ID of the character
        in: path
        name: character_id
        required: true
