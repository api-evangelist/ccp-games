            format: int64
            type: integer
          start_date:
            format: date-time
            type: string
        required:
        - start_date
        - record_id
        type: object
      type: array
    CorporationsCorporationIdMedalsGet:
      items:
        properties:
          created_at:
            format: date-time
            type: string
